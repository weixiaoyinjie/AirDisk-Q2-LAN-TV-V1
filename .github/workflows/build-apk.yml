
name: Build AirDisk Q2 LAN TV APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          unzip -q AirDisk-Q2-LAN-TV-V1-Source.zip -d extracted
          test -f extracted/AirDisk-Q2-LAN-TV-V1/settings.gradle

      - name: Build debug APK
        run: gradle -p extracted/AirDisk-Q2-LAN-TV-V1 :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirDisk-Q2-LAN-TV-debug
          path: extracted/AirDisk-Q2-LAN-TV-V1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
